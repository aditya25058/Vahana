# P3: build one wheel per platform, install it into a clean environment with CPU torch, and check that this
# machine gives the same bits as the reference H100 (vahana selftest) under every kernel build the runner can run.
name: wheels

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]                 # a version tag also publishes to PyPI (job `publish`, below)
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, torch_index: "https://download.pytorch.org/whl/cpu" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, torch_index: "https://download.pytorch.org/whl/cpu" }
          - { name: windows-x86_64, os: windows-2022, torch_index: "https://download.pytorch.org/whl/cpu" }
          - { name: macos-arm64, os: macos-15, torch_index: "" }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel (Linux in manylinux_2_28 via cibuildwheel; Windows, macOS with python -m build)
        shell: bash
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: "auto64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: "VAHANA_STATIC_LIBSTDCXX=1"
        run: |
          set -o pipefail
          clang++ --version || true
          if [ "$RUNNER_OS" = Linux ]; then
            python -m pip install cibuildwheel==2.22.0
            cmd="python -m cibuildwheel --output-dir dist"
          else
            python -m pip install --upgrade build
            cmd="python -m build --wheel --outdir dist ."
          fi
          if ! $cmd 2>&1 | tee build.log; then
            grep -iE "error|undefined|fatal|not found" build.log | head -30 | sed 's/^/::error title=build::/'
            exit 1
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/venv/Scripts/python.exe"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          if [ -n "${{ matrix.torch_index }}" ]; then
            "$PY" -m pip install torch --index-url "${{ matrix.torch_index }}"
          else
            "$PY" -m pip install torch
          fi
          # the wheel with its declared dependencies, exactly as `pip install vahana` resolves them for a user
          "$PY" -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$PY" -c "import vahana, os; print(os.listdir(os.path.join(os.path.dirname(vahana.__file__), '_build')))"
          "$PY" -c "import torch, transformers, vahana.hybrid as h; k = h.ext(); print('kernel', k.path, k.isa(), 'threads', k.threads(), 'torch', torch.__version__, 'transformers', transformers.__version__)"

      - name: vahana selftest (every kernel build this CPU runs)
        shell: bash
        env:
          VAHANA_THREADS: "4"
          OMP_NUM_THREADS: "1"
        run: |
          cd "$RUNNER_TEMP"
          ISAS=$("$PY" -c "from vahana import hybrid as h; i = h.cpu_isa(); print(' '.join({'avx512': ['avx512', 'avx2', 'scalar'], 'avx2': ['avx2', 'scalar'], 'neon': ['neon', 'scalar']}.get(i, [i])))")
          echo "builds to check: $ISAS"
          fail=0
          for isa in $ISAS; do
            echo "::group::selftest $isa"
            VAHANA_ISA=$isa "$PY" -m vahana.selftest --device cpu 2>&1 | tee "selftest_$isa.txt" || fail=1
            grep -E "DIFFERENT|error" "selftest_$isa.txt" | head -20 | sed "s/^/::error title=selftest $isa::/" || true
            echo "::endgroup::"
            echo "::notice title=selftest ${{ matrix.name }} $isa::$(tail -1 selftest_$isa.txt)"
          done
          exit $fail

      - name: Tests (CPU)
        shell: bash
        env:
          VAHANA_THREADS: "4"
          OMP_NUM_THREADS: "1"
        run: |
          cd "$RUNNER_TEMP"
          "$PY" -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests/test_twin.py" "$GITHUB_WORKSPACE/tests/test_modelspec.py" "$GITHUB_WORKSPACE/tests/test_doctor.py" "$GITHUB_WORKSPACE/tests/test_selftest_versions.py" "$GITHUB_WORKSPACE/tests/test_tsolve.py" "$GITHUB_WORKSPACE/tests/test_receipt.py" "$GITHUB_WORKSPACE/tests/test_prefill.py" "$GITHUB_WORKSPACE/tests/test_prefix.py" "$GITHUB_WORKSPACE/tests/test_triton_missing.py" "$GITHUB_WORKSPACE/tests/test_readme_links.py" "$GITHUB_WORKSPACE/tests/test_q4_kernel.py" "$GITHUB_WORKSPACE/tests/test_q4lin.py" "$GITHUB_WORKSPACE/tests/test_combine.py"

  # v1.1: every supported transformers release must give its reference bits. Vahana runs transformers' own model code,
  # and a release can change a family's model code (5.14: qwen3_5_moe_text, 5.19: gpt_oss), which changes that family's
  # outputs on every machine alike; golden_tiny.json therefore holds per-version references (tools/dev/golden_versions.py).
  # Linux x86-64, Python 3.12, CPU torch. "latest" is a canary: it installs the newest transformers and never fails the
  # build; its notice lists any family whose hash is new, so the range can be widened with a new reference.
  compat:
    name: transformers ${{ matrix.tf }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.tf == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        tf: ["5.12.1", "5.13.1", "5.14.1", "5.15.1", "5.16.1", "5.17.0", "5.18.0", "5.19.0", "5.20.2", "5.21.1",
             "5.22.2", "5.23.0", "5.24.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vahana (from source, avx2 + scalar kernels) with transformers ${{ matrix.tf }}
        env:
          VAHANA_ISAS: "avx2 scalar"
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q --no-deps .
          if [ "${{ matrix.tf }}" = "latest" ]; then TF="transformers"; else TF="transformers==${{ matrix.tf }}"; fi
          python -m pip install -q -U "$TF" "accelerate>=1.0" "safetensors>=0.4" "numpy>=1.24"
          python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
      - name: vahana selftest (CPU)
        run: |
          cd /tmp
          vahana selftest --device cpu | tee st.txt
          echo "::notice title=transformers ${{ matrix.tf }}::$(tail -1 st.txt) $(grep DIFFERENT st.txt | awk '{print $1"="$2}' | xargs)"
          grep -q "18/18" st.txt

  # v1.0: source distribution (the wheels carry the prebuilt kernels; the sdist builds them with a C++20 compiler)
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --sdist --outdir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # v1.0: publish to PyPI, only for a pushed version tag (e.g. v1.0.0), and only after every platform's wheel passed
  # its selftest. Uses PyPI trusted publishing: no token is stored here. One-time setup on pypi.org (owner only): add a
  # trusted publisher for this repository, workflow `wheels.yml`, environment `pypi` (see docs/RELEASING.md).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist, compat]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
