[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vahana"
version = "0.3.0.dev0"
description = "Exact inference for MoE models too big for your GPU"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "aditya25058" }]
dependencies = [
  "torch>=2.4",
  "transformers>=5.0",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "numpy>=1.24",
]

[project.scripts]
vahana = "vahana.cli:main"

[project.optional-dependencies]
gpu = ["triton>=3.0"]          # NVIDIA GPUs (Linux; Windows via triton-windows)
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the CPU kernel, one library per instruction set (built by setup.py / csrc/build.py), and the selftest reference
vahana = ["_build/*/vahana_kernel.*", "golden_tiny.json", "csrc/*.cpp", "csrc/*.h", "csrc/*.py", "csrc/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
