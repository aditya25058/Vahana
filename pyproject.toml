[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vahana"
version = "1.3.1"
description = "Exact, bit-reproducible inference and serving for Mixture-of-Experts models too big for your GPU"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aditya Sai Teja B" }]
license = { text = "Apache-2.0" }
keywords = ["llm", "inference", "mixture-of-experts", "moe", "deterministic", "reproducible", "serving"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.4",
  "transformers>=5.12,<5.25",     # v1.1: every release here has per-version selftest references, checked by CI `compat`
  "accelerate>=1.0",
  "safetensors>=0.4",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/vahana-ai/Vahana"
Source = "https://github.com/vahana-ai/Vahana"
Changelog = "https://github.com/vahana-ai/Vahana/blob/main/CHANGELOG.md"

[project.scripts]
vahana = "vahana.cli:main"

[project.optional-dependencies]
gpu = [                        # NVIDIA GPUs: Triton on Linux, triton-windows on Windows
  "triton>=3.0; platform_system == 'Linux'",
  "setuptools; platform_system == 'Linux'",   # v1.3.1: Triton 3.2+ imports it at startup; fresh 3.12 venvs lack it
  "triton-windows>=3.2; platform_system == 'Windows'",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the CPU kernel, one library per instruction set (built by setup.py / csrc/build.py), and the selftest reference
vahana = ["_build/*/vahana_kernel.so", "_build/*/vahana_kernel.dll", "_build/*/vahana_kernel.dylib", "golden_tiny.json", "csrc/*.cpp", "csrc/*.h", "csrc/*.py", "csrc/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
